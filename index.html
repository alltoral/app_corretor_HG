<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HG Corretor de Imóveis</title>
<meta name="theme-color" content="#242b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HG Imóveis">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<style>
  :root{
    --brand-900:#242b52;
    --brand-800:#313d7c;
    --brand-700:#4c60b0;
    --brand-100:#eef1fa;
    --paper:#f7f8fb;
    --ink:#1c2233;
    --muted:#626b82;
    --line:#dfe3ee;
    --danger:#a83232;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:var(--brand-900);
    color:#fff;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #logoBox{
    width:44px;height:44px;border-radius:10px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;overflow:hidden;
    border:1px solid rgba(255,255,255,.25);
  }
  #logoBox img{width:100%;height:100%;object-fit:cover;}
  #logoInput{display:none;}
  header h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.2;}
  header .sub{font-size:10.5px;color:rgba(255,255,255,.55);margin-top:1px;}

  main{max-width:760px;margin:0 auto;padding:14px 14px 90px;}

  .toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .search-row{display:flex;gap:8px;}
  .search-row input{
    flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
    font-size:14px;background:#fff;min-width:0;
  }
  .icon-btn{
    width:42px;height:42px;flex-shrink:0;border-radius:var(--radius);border:1px solid var(--line);
    background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn.active{background:var(--brand-800);border-color:var(--brand-800);color:#fff;}
  #imgSearchInput{display:none;}
  .img-search-banner{
    display:none;background:var(--brand-100);border:1px solid var(--brand-700);color:var(--brand-900);
    border-radius:8px;padding:8px 10px;font-size:12.5px;align-items:center;gap:8px;justify-content:space-between;
  }
  .img-search-banner.show{display:flex;}
  .img-search-banner button{background:none;border:none;color:var(--brand-800);font-weight:700;cursor:pointer;font-size:12px;}

  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .filter-chip{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:6px 12px;border-radius:20px;font-size:12.5px;white-space:nowrap;cursor:pointer;
    font-weight:600;
  }
  .filter-chip.active{background:var(--brand-900);border-color:var(--brand-900);color:#fff;}

  .grid{display:flex;flex-direction:column;gap:10px;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;cursor:pointer;transition:box-shadow .15s;position:relative;
  }
  .card:active{box-shadow:inset 0 0 0 2px var(--brand-700);}
  .card .thumb{
    width:96px;height:96px;flex-shrink:0;background:var(--brand-100);
    display:flex;align-items:center;justify-content:center;color:var(--brand-700);
    font-size:11px;overflow:hidden;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .info{padding:10px 12px;flex:1;min-width:0;}
  .card .tags{display:flex;gap:5px;margin-bottom:4px;align-items:center;}
  .tag{
    font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:4px;text-transform:uppercase;
  }
  .tag.venda{background:var(--brand-900);color:#fff;}
  .tag.aluguel{background:var(--brand-700);color:#fff;}
  .tag.categoria{background:var(--brand-100);color:var(--brand-800);text-transform:none;}
  .tag.codigo{background:none;color:var(--muted);font-weight:600;text-transform:none;padding:0;font-size:11px;}
  .card .titulo{font-size:14.5px;font-weight:700;margin:0 0 2px;color:var(--brand-900);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .end{font-size:12.5px;color:var(--muted);margin:0 0 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .valor{font-size:14px;font-weight:700;color:var(--brand-800);margin:0;}
  .match-badge{
    position:absolute;top:8px;right:8px;background:var(--brand-800);color:#fff;font-size:10px;
    font-weight:700;padding:3px 7px;border-radius:12px;
  }

  .empty{text-align:center;color:var(--muted);padding:60px 20px;}

  .fab{
    position:fixed;bottom:20px;right:20px;
    background:var(--brand-900);color:#fff;border:none;
    width:56px;height:56px;border-radius:50%;font-size:26px;
    box-shadow:0 4px 14px rgba(36,43,82,.4);cursor:pointer;z-index:30;
    display:flex;align-items:center;justify-content:center;
  }

  .overlay{
    position:fixed;inset:0;background:var(--paper);z-index:50;
    overflow-y:auto;display:none;
  }
  .overlay.open{display:block;}
  .overlay-header{
    background:var(--brand-900);color:#fff;padding:14px 16px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;
  }
  .overlay-header button.back{
    background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px;
  }
  .overlay-header h2{font-size:15px;margin:0;flex:1;font-weight:600;}
  .overlay-body{padding:16px;max-width:760px;margin:0 auto;}

  label{display:block;font-size:12px;font-weight:700;color:var(--brand-800);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.3px;}
  input[type=text],input[type=number],textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;
    font-family:inherit;background:#fff;
  }
  textarea{resize:vertical;min-height:80px;}
  .tipo-toggle{display:flex;gap:8px;}
  .tipo-toggle button{
    flex:1;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;
    font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;
  }
  .tipo-toggle button.on{background:var(--brand-800);border-color:var(--brand-800);color:#fff;}
  .tipo-toggle button.on.venda{background:var(--brand-900);border-color:var(--brand-900);color:#fff;}
  .tipo-toggle button.on.aluguel{background:var(--brand-700);border-color:var(--brand-700);color:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .mini-field{margin-bottom:0;}
  .mini-field .mini-label{
    display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin:0 0 4px;
    text-transform:uppercase;letter-spacing:.3px;
  }

  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-item{width:78px;height:78px;border-radius:8px;overflow:hidden;position:relative;background:var(--brand-100);}
  .photo-item.uploading img{opacity:.55;}
  .photo-item .upload-spinner{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:rgba(255,255,255,.25);
  }
  .photo-item img{width:100%;height:100%;object-fit:cover;}
  .photo-item .rm{
    position:absolute;top:2px;right:2px;background:rgba(20,20,20,.65);color:#fff;
    border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;
  }
  .add-photo{
    width:78px;height:78px;border-radius:8px;border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;
    cursor:pointer;background:#fff;
  }
  #photoInput{display:none;}

  .btn-row{display:flex;gap:10px;margin-top:26px;}
  .btn{
    flex:1;padding:13px;border-radius:8px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--brand-900);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand-900);border:1.5px solid var(--brand-900);}
  .btn.danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}

  .gallery{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;}
  .gallery img{width:100%;max-height:280px;object-fit:cover;border-radius:10px;flex-shrink:0;}
  .gallery.single img{width:100%;}
  .gallery:not(.single) img{width:80%;}
  .gallery-empty{
    height:180px;border-radius:10px;background:var(--brand-100);color:var(--brand-700);
    display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:14px;
  }
  .detail-title{font-size:19px;font-weight:800;color:var(--brand-900);margin:0 0 4px;}
  .detail-codigo{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px;}
  .detail-end{font-size:14px;color:var(--muted);margin:0 0 10px;}
  .detail-valor{font-size:22px;font-weight:800;color:var(--brand-800);margin:0 0 12px;}
  .detail-tags{display:flex;gap:6px;margin-bottom:10px;}
  .specs{display:flex;flex-wrap:wrap;gap:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px;}
  .spec{font-size:13px;color:var(--brand-800);}
  .spec b{display:block;font-size:15px;color:var(--brand-900);}
  .detail-desc{font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}

  .client-mode .admin-only{display:none !important;}
  .mode-toggle{display:flex;gap:6px;font-size:11px;}
  .mode-toggle button{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;
    padding:5px 10px;border-radius:14px;cursor:pointer;font-weight:600;
  }
  .mode-toggle button.active{background:#fff;color:var(--brand-900);}

  @media (min-width:820px){
    main{max-width:900px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .overlay-body{max-width:640px;}
  }

  #sharedPage{display:none;}
  body.shared-mode header, body.shared-mode main, body.shared-mode .fab{display:none !important;}
  body.shared-mode #sharedPage{display:block;max-width:760px;margin:0 auto;}
  .shared-header{
    background:var(--brand-900);color:#fff;display:flex;align-items:center;gap:10px;
    padding:14px 16px;position:sticky;top:0;
  }
  .shared-header img{width:36px;height:36px;border-radius:8px;background:#fff;}
  .shared-header span{font-size:14.5px;font-weight:700;}
  .shared-footer{
    text-align:center;padding:24px 16px 40px;color:var(--muted);font-size:12.5px;
  }
  .shared-footer a{color:var(--brand-800);font-weight:600;text-decoration:none;}
  .shared-not-found{text-align:center;padding:60px 20px;color:var(--muted);}

  @media print{
    header, .fab, .admin-only, .overlay-header{display:none !important;}
    .overlay{position:static;}
    body{background:#fff;}
  }
</style>
</head>

<div class="overlay" id="formOverlay">
  <div class="overlay-header">

    <label>🏷️ Anúncio</label>

        catch(e){ return null; }
      }
      return localStorage.getItem(key);
    },
    async set(key, value){
      if(this.hasCloud){
        try{ return await window.storage.set(key, value, false); }
        catch(e){ return null; }
      }
      localStorage.setItem(key, value);
      return true;
    },
    async delete(key){
      if(this.hasCloud){
        try{ return await window.storage.delete(key, false); }
        catch(e){ return null; }
      }
      localStorage.removeItem(key);
      return true;
    }
  };

  // ---------- image helpers ----------
  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let {width, height} = img;
          if(width > height && width > maxDim){
            height = Math.round(height * (maxDim/width)); width = maxDim;
          } else if(height > maxDim){
            width = Math.round(width * (maxDim/height)); height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Resizes to a large, still-sharp size and returns a Blob, for uploading full-quality photos to Storage
  function compressImageToBlob(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let {width, height} = img;
          if(width > height && width > maxDim){
            height = Math.round(height * (maxDim/width)); width = maxDim;
          } else if(height > maxDim){
            width = Math.round(width * (maxDim/height)); height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Uploads a photo to Firebase Storage (when available) and returns its public URL.
  // Falls back to an inline base64 image when Storage isn't configured (e.g. preview inside Claude).
  async function uploadPhoto(file, imovelId, index){
    if(storageRef){
      const path = `imoveis/${imovelId}/${Date.now()}_${index}.jpg`;
      const blob = await compressImageToBlob(file, 1280, 0.62);
      const ref = storageRef.ref().child(path);
      await ref.put(blob);
      return await ref.getDownloadURL();
    }
    return await compressImage(file, 900, 0.6);
  }

  async function deletePhotoFromStorage(url){
    if(!storageRef || typeof url !== 'string' || !url.startsWith('https://firebasestorage')) return;
    try{ await storageRef.refFromURL(url).delete(); }catch(e){}
  }

  // perceptual difference-hash (dHash), 64-bit string, used for "busca por foto"
  function computeDHash(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const w = 9, h = 8;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;
        const gray = [];
        for(let i=0;i<w*h;i++){
          gray.push((data[i*4] + data[i*4+1] + data[i*4+2]) / 3);
        }
        let bits = '';
        for(let y=0;y<h;y++){
          for(let x=0;x<w-1;x++){
            bits += (gray[y*w+x] > gray[y*w+x+1]) ? '1' : '0';
          }
        }
        resolve(bits);
      };
      img.onerror = reject;
      img.src = src;
    });
  }
  function hammingDist(a, b){
    if(!a || !b || a.length !== b.length) return 999;
    let d = 0;
    for(let i=0;i<a.length;i++) if(a[i] !== b[i]) d++;
    return d;
  }

  // ---------- render list ----------
  function render(){

        if(currentFilter !== 'todos' && !(im.tipo||[]).includes(currentFilter)) return false;
        if(currentCatFilter !== 'todas' && im.categoria !== currentCatFilter) return false;
        if(q){
          const hay = (im.endereco + ' ' + im.bairro + ' ' + im.titulo + ' ' + (im.codigo||'')).toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });
    }

    grid.innerHTML = '';
    if(list.length === 0){
      emptyState.style.display = 'block';
      emptyState.querySelector('p').innerHTML = imgSearchResults
        ? 'Nenhum imóvel com foto parecida foi encontrado.'
        : 'Nenhum imóvel encontrado.<br>Toque no botão + para cadastrar o primeiro.';
      return;
    }
    emptyState.style.display = 'none';

    list.forEach(entry => {
      const im = imgSearchResults ? entry.im : entry;
      const card = document.createElement('div');
      card.className = 'card';
      const thumbSrc = im.capaThumb || (im.fotos && im.fotos[0]);

      const tags = (im.tipo||[]).map(t => `<span class="tag ${t}">${t === 'venda' ? 'Venda' : 'Aluguel'}</span>`).join('');
      const catTag = im.categoria ? `<span class="tag categoria">${im.categoria === 'casa' ? '🏠 Casa' : '🏢 Apto'}</span>` : '';
      const codigoTag = im.codigo ? `<span class="tag codigo">🔑${escapeHtml(im.codigo)}</span>` : '';
      card.innerHTML = `

        <div class="thumb">${thumb}</div>
        <div class="info">

  $('#imgSearchBtn').addEventListener('click', () => $('#imgSearchInput').click());

    $('#imgSearchBtn').classList.add('active');

    $('#imgSearchBanner').classList.add('show');
    try{
      const compact = await compressImage(file, 300, 0.7);
      const hash = await computeDHash(compact);
      imgSearchHash = hash;
      const scored = imoveis
        .filter(im => im.fotoHash)
        .map(im => {
          const dist = hammingDist(hash, im.fotoHash);
          const pct = Math.max(0, Math.round((64 - dist) / 64 * 100));
          return {im, dist, pct};
        })
        .sort((a,b) => a.dist - b.dist)
        .slice(0, 10);
      imgSearchResults = scored;
      $('#imgSearchLabel').textContent = scored.length
        ? `Busca por foto: ${scored.length} imóvel(is) parecido(s)`
        : 'Busca por foto: nenhum imóvel com foto cadastrada ainda';
    }catch(err){

  function renderPhotoGrid(){
    const gridEl = $('#photoGrid');
    gridEl.innerHTML = '';
    formPhotos.forEach((src, idx) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `<img src="${src}"><button class="rm" data-idx="${idx}">✕</button>`;
      gridEl.appendChild(item);
    });
    uploadingPreviews.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'photo-item uploading';
      item.innerHTML = `<img src="${p.localUrl}"><div class="upload-spinner">⏳</div>`;
      gridEl.appendChild(item);
    });
    if(formPhotos.length + uploadingPreviews.length < 20){
      const addBtn = document.createElement('div');
      addBtn.className = 'add-photo';
      addBtn.textContent = '+';
      gridEl.appendChild(addBtn);
      addBtn.addEventListener('click', () => $('#photoInput').click());
    }
    gridEl.querySelectorAll('.rm').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(btn.dataset.idx);
        const removed = formPhotos.splice(idx, 1)[0];
        deletePhotoFromStorage(removed);
        if(idx === 0){ formFotoHash = null; formCapaThumb = null; }
        renderPhotoGrid();
      });
    });
  }

  // Uploads all selected photos in parallel and shows an instant local preview for each,
  // so the grid fills up right away instead of waiting one-by-one for the network.
  $('#photoInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []).slice(0, 20 - formPhotos.length - uploadingPreviews.length);
    if(!files.length) return;
    const statusEl = $('#photoUploadStatus');
    let remaining = files.length;
    if(statusEl) statusEl.textContent = `Enviando ${files.length} foto(s)...`;

    files.forEach((file, i) => {
      const localUrl = URL.createObjectURL(file);
      const previewId = 'up_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2,6);
      uploadingPreviews.push({id: previewId, localUrl});
      renderPhotoGrid();

      (async () => {
        try{
          if(formPhotos.length === 0 && uploadingPreviews[0] && uploadingPreviews[0].id === previewId && !formFotoHash){
            try{
              const previewDataUrl = await compressImage(file, 300, 0.6);
              formFotoHash = await computeDHash(previewDataUrl);
              formCapaThumb = await compressImage(file, 260, 0.6);
            }catch(hashErr){}
          }
          const url = await uploadPhoto(file, editingId, Date.now() + '_' + i);
          formPhotos.push(url);
        }catch(err){
          alert('Não foi possível enviar uma das fotos. Tente novamente.');
        }finally{
          uploadingPreviews = uploadingPreviews.filter(p => p.id !== previewId);
          URL.revokeObjectURL(localUrl);
          remaining--;
          if(statusEl) statusEl.textContent = remaining > 0 ? `Enviando... (${remaining} restante${remaining>1?'s':''})` : '';
          renderPhotoGrid();
        }
      })();
    });
    e.target.value = '';
  });

  function buildPropertyMarkup(im){
    const gallery = (im.fotos && im.fotos.length)
      ? `<div class="gallery ${im.fotos.length===1?'single':''}">${im.fotos.map((f,i)=>`<img src="${f}" loading="${i===0?'eager':'lazy'}" decode="async">`).join('')}</div>`

    const specs = [];
    if(im.quartos) specs.push(`<div class="spec"><b>🛏️ ${im.quartos}</b>Quartos</div>`);
    if(im.banheiros) specs.push(`<div class="spec"><b>🛁 ${im.banheiros}</b>Banheiros</div>`);

    if(im.area) specs.push(`<div class="spec"><b>📐 ${im.area}m²</b>Área</div>`);
    if(im.financiamento) specs.push(`<div class="spec"><b>🚨 ${im.financiamento === 'sim' ? 'Sim' : 'Não'}</b>Financiamento</div>`);

    return `
      ${gallery}
      <div class="detail-tags">${tags}</div>
      <p class="detail-title">${escapeHtml(im.titulo || 'Sem título')}</p>
      ${im.codigo ? `<p class="detail-codigo">🔑 Código: ${escapeHtml(im.codigo)}</p>` : ''}

      <p class="detail-valor">💰 ${fmtMoney(im.valor)}</p>
      ${specs.length ? `<div class="specs">${specs.join('')}</div>` : ''}
      ${im.descricao ? `<p class="detail-desc">${escapeHtml(im.descricao)}</p>` : ''}
    `;
  }

  async function shareProperty(im){
    const url = `${location.origin}${location.pathname}?imovel=${encodeURIComponent(im.id)}`;
    if(navigator.share){
      try{ await navigator.share({title: im.titulo || 'Imóvel', text: 'Confira este imóvel:', url}); return; }
      catch(e){ /* user cancelled or unsupported, fall through to copy */ }

    try{
      await navigator.clipboard.writeText(url);
      alert('Link copiado! Cole no WhatsApp, e-mail ou onde quiser enviar pro cliente.');
    }catch(e){
      prompt('Copie o link abaixo e envie pro cliente:', url);

    $('#detailBody').innerHTML = buildPropertyMarkup(im) + `
      <div class="btn-row admin-only">
        <button class="btn ghost" id="editBtn">Editar</button>
        <button class="btn danger" id="deleteBtn">Excluir</button>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="shareBtn">🔗 Enviar link pro cliente</button>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="printBtn">Imprimir / salvar PDF</button>
      </div>
    `;
    $('#editBtn')?.addEventListener('click', () => { closeDetail(); openForm(im); });
    $('#deleteBtn')?.addEventListener('click', async () => {
      if(confirm('Excluir este imóvel do catálogo? Essa ação não pode ser desfeita.')){
        await deleteImovel(im.id);
        closeDetail();
      }
    });
    $('#shareBtn').addEventListener('click', () => shareProperty(im));
    $('#printBtn').addEventListener('click', () => window.print());
  }

  $('#detailBack').addEventListener('click', closeDetail);
  $('#modeAdmin').addEventListener('click', () => { clientMode = false; renderDetail(); });
  $('#modeClient').addEventListener('click', () => { clientMode = true; renderDetail(); });


  // ---------- logo ----------
  $('#logoBox').addEventListener('click', () => $('#logoInput').click());
  $('#logoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const compressed = await compressImage(file, 300, 0.85);
      await saveLogo(compressed);
      $('#logoImg').src = compressed;
    }catch(err){
      alert('Não foi possível carregar a logo.');
    }
    e.target.value = '';
  });

  // ---------- PWA: service worker (safe no-op if unsupported / not hosted) ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  // ---------- shared property link (public view, no login needed) ----------
  async function checkSharedView(){
    const params = new URLSearchParams(location.search);
    const sharedId = params.get('imovel');
    if(!sharedId) return false;

    document.body.classList.add('shared-mode');
    const container = $('#sharedBody');
    container.innerHTML = '<p style="text-align:center;color:var(--muted);padding:50px 0;">Carregando imóvel...</p>';

    let im = null;
    if(MODE === 'firestore'){
      try{
        const doc = await firestoreDb.collection('imoveis').doc(sharedId).get();
        if(doc.exists) im = doc.data();
      }catch(e){}
    } else {
      const items = await loadAllLegacy();
      im = items.find(i => i.id === sharedId) || null;
    }

    if(!im){
      container.innerHTML = `<div class="shared-not-found">
        <div style="font-size:36px;">🏠</div>
        <p>Este imóvel não foi encontrado ou não está mais disponível.</p>
      </div>`;
      return true;
    }

    container.innerHTML = buildPropertyMarkup(im) + `
      <div class="btn-row">
        <button class="btn primary" id="sharedPrintBtn">Imprimir / salvar PDF</button>
      </div>
      <div class="shared-footer">Ficha gerada por HG Corretor de Imóveis</div>
    `;
    $('#sharedPrintBtn').addEventListener('click', () => window.print());
    return true;
  }

  // ---------- init ----------
  checkSharedView().then((wasShared) => {
    if(!wasShared){
      loadLogo();
      loadAll();
    }
  });
})();
</script>
</body>
</html>
